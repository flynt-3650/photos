[project]
name = "dupekiller"
version = "0.2.0"
description = "Local duplicate finder for exact files, near-identical images and similar documents."
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0",
  "pypdf>=4.0.0",
  "scikit-learn>=1.4.0"
]

[project.scripts]
dupekiller = "dupekiller.cli:main"

[tool.setuptools]
packages = ["dupekiller"]
